<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stabhochsprung – Training</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>Stabhochsprung – Training</h1>
  <button id="switch" class="link hidden" type="button">Name wechseln</button>
</header>

<main>
  <!-- Einrichtung: Gruppen-Code und Name -->
  <section id="setup" class="card hidden">
    <h2>Willkommen!</h2>
    <div id="code-field" class="field hidden">
      <label for="code">Gruppen-Code</label>
      <p class="hint">Den Code bekommst du vom Trainer.</p>
      <input id="code" type="password" autocomplete="off">
    </div>
    <div id="name-field" class="field hidden">
      <label for="name">Wer bist du?</label>
      <select id="name"></select>
    </div>
    <button id="setup-go" class="full" type="button">Weiter</button>
    <div id="setup-msg" class="msg err hidden"></div>
  </section>

  <!-- Eintragen -->
  <section id="entry" class="card hidden">
    <h2 id="hello"></h2>
    <div class="field">
      <label for="date">Datum</label>
      <input id="date" type="date">
      <p id="date-info" class="hint"></p>
    </div>
    <p class="hint">Trag ein, was du heute gemacht hast. Übungen, die du nicht gemacht hast, einfach leer lassen.</p>
    <form id="form" novalidate></form>
    <button id="save" class="full" type="button">Speichern</button>
    <div id="save-msg" class="msg hidden"></div>
  </section>

  <!-- Eigene Werte -->
  <section id="mine" class="card hidden">
    <h2>Meine Bestleistungen</h2>
    <div id="stats" class="stat-grid"></div>
  </section>
</main>

<script src="/common.js"></script>
<script>
let CONFIG = null;   // {athletes, exercises}
let ENTRIES = [];    // eigene Einträge

const codeHeader = () => ({ 'x-code': store('sh_code') || '' });

async function loadConfig() {
  CONFIG = await api('/api/config', { headers: codeHeader() });
}

function showSetup(needCode, error) {
  $('#entry').classList.add('hidden');
  $('#mine').classList.add('hidden');
  $('#switch').classList.add('hidden');
  $('#setup').classList.remove('hidden');
  $('#code-field').classList.toggle('hidden', !needCode);
  $('#name-field').classList.toggle('hidden', !CONFIG);
  if (CONFIG) {
    const cur = store('sh_name');
    $('#name').innerHTML = '<option value="">– Name wählen –</option>' +
      CONFIG.athletes.map((n) => `<option ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('');
  }
  const m = $('#setup-msg');
  m.textContent = error || '';
  m.classList.toggle('hidden', !error);
}

function buildForm() {
  $('#form').innerHTML = CONFIG.exercises.map((ex) => `
    <div class="field">
      <label for="v-${ex.key}">${esc(ex.label)}</label>
      <p class="hint">${esc(ex.hint)}</p>
      <div class="row-input">
        <input id="v-${ex.key}" data-key="${ex.key}" type="text" inputmode="decimal" autocomplete="off" placeholder="–">
        <span class="unit">${esc(ex.unit)}</span>
      </div>
    </div>`).join('');
  $('#form').querySelectorAll('input').forEach((inp) => inp.addEventListener('input', () => {
    const v = inp.value.trim();
    inp.classList.toggle('invalid', v !== '' && !VALUE_RE.test(v));
  }));
}

// Wenn für das gewählte Datum schon Werte existieren: ins Formular laden (dann kann man korrigieren)
function fillForDate() {
  const d = $('#date').value;
  const existing = ENTRIES.filter((e) => e.date === d);
  $('#form').querySelectorAll('input').forEach((inp) => {
    const e = existing.find((x) => x.exercise === inp.dataset.key);
    inp.value = e ? fmtNum(e.value) : '';
    inp.classList.remove('invalid');
  });
  $('#date-info').textContent = existing.length
    ? `Für diesen Tag hast du schon ${existing.length} Wert(e) eingetragen. Du kannst sie hier ändern.`
    : '';
}

function renderStats() {
  const html = CONFIG.exercises.map((ex) => {
    const s = seriesFor(ENTRIES, ex.key);
    const st = stats(s);
    if (!st) return '';
    const cls = st.delta > 0 ? 'up' : st.delta < 0 ? 'down' : '';
    const delta = st.delta === null ? '' : ` · <span class="${cls}">${fmtDelta(st.delta)}</span> seit Start`;
    return `<div class="stat">
      <div><div class="name">${esc(ex.label)}</div>
        <div class="sub">zuletzt ${fmtNum(st.last)} ${esc(ex.unit)} am ${fmtDate(st.lastDate)}${delta}</div></div>
      <div class="best">${fmtNum(st.best)} <small>${esc(ex.unit)}</small></div>
      <div style="grid-column:1/-1">${sparkline(s, 300, 34)}</div>
    </div>`;
  }).join('');
  $('#stats').innerHTML = html || '<p class="muted">Noch keine Einträge. Trag oben deine ersten Resultate ein!</p>';
  $('#mine').classList.remove('hidden');
}

async function loadMine() {
  const data = await api('/api/entries?athlete=' + encodeURIComponent(store('sh_name')), { headers: codeHeader() });
  ENTRIES = data.entries;
  renderStats();
  fillForDate();
}

async function showEntry() {
  $('#setup').classList.add('hidden');
  $('#entry').classList.remove('hidden');
  $('#switch').classList.remove('hidden');
  $('#hello').textContent = `Hallo ${store('sh_name')}!`;
  buildForm();
  $('#date').value = todayISO();
  $('#date').max = todayISO();
  await loadMine();
}

async function start() {
  try {
    await loadConfig();
  } catch (e) {
    if (e.status === 401) return showSetup(true, store('sh_code') ? e.message : '');
    return showSetup(false, 'Verbindung fehlgeschlagen: ' + e.message);
  }
  const name = store('sh_name');
  if (!name || !CONFIG.athletes.includes(name)) return showSetup(false);
  try { await showEntry(); } catch (e) { showSetup(false, e.message); }
}

$('#setup-go').addEventListener('click', async () => {
  if (!$('#code-field').classList.contains('hidden')) store('sh_code', $('#code').value.trim());
  if (!CONFIG) return start();
  const n = $('#name').value;
  if (!n) return showSetup(false, 'Bitte deinen Namen wählen.');
  store('sh_name', n);
  start();
});

$('#switch').addEventListener('click', () => { store('sh_name', null); showSetup(false); });
$('#date').addEventListener('change', fillForDate);

$('#save').addEventListener('click', async () => {
  const msg = $('#save-msg');
  const values = {};
  let bad = false;
  $('#form').querySelectorAll('input').forEach((inp) => {
    const v = inp.value.trim();
    if (v === '') return;
    if (!VALUE_RE.test(v)) { bad = true; inp.classList.add('invalid'); }
    values[inp.dataset.key] = v;
  });
  const show = (ok, text) => { msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.textContent = text; };
  if (bad) return show(false, 'Bitte nur Zahlen eintragen, z. B. 12 oder 7,5 (ohne m, Stk oder Sek).');
  if (!Object.keys(values).length) return show(false, 'Bitte mindestens ein Resultat eintragen.');
  $('#save').disabled = true;
  try {
    const r = await api('/api/entries', { method: 'POST', headers: codeHeader(),
      body: { athlete: store('sh_name'), date: $('#date').value, values } });
    show(true, `Gespeichert ✓ (${r.saved} Wert${r.saved === 1 ? '' : 'e'})`);
    await loadMine();
  } catch (e) {
    show(false, e.message);
  } finally {
    $('#save').disabled = false;
  }
});

start();
</script>
</body>
</html>
